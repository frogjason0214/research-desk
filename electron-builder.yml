appId: tw.research-desk.app
productName: Research Desk
directories:
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/sql.js/dist/*.wasm
win:
  target: nsis
# 檔名不要有空格，GitHub 會把空格換成點，自動更新會找不到檔案
artifactName: ResearchDesk-Setup-${version}.${ext}
# Mac 測試版：只存本機、不簽章（沒有 Apple 開發者帳號），由 GitHub Actions 在 Mac 上建置
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.education
  identity: null
  artifactName: ResearchDesk-${version}-mac-${arch}.${ext}
dmg:
  artifactName: ResearchDesk-${version}-mac-${arch}.${ext}
afterSign: scripts/mac-adhoc-sign.cjs
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Research Desk
# 發布到 GitHub Releases；安裝版啟動時從這裡檢查更新
publish:
  provider: github
  owner: frogjason0214
  repo: research-desk
  releaseType: release
